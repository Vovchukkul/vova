services:
  postgres:
    image: postgres:16.10
    container_name: exhibition_database
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - exhibition_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exhibition_backend
    restart: unless-stopped
    command: ["/bin/bash", "/commands/run_web_server_dev.sh"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/usr/src/app
    networks:
      - exhibition_net


volumes:
  pg_data:
    name: exhibition_pg_data


networks:
  exhibition_net:
    driver: bridge